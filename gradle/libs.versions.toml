[versions]
kotlin_version = "2.2.20"
ktlint_version = "11.6.1"
detekt_version = "1.23.8"
koin_version = "4.1.1"
junitJupiterVersion = "5.8.1"

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin_version" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt_version" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint_version" }

[libraries]
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin_version" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junitJupiterVersion" }
